# Publishes to PyPI when a GitHub release is published (tag v1.2.3, matching reelspan_smolagents.__version__). Uses PyPI trusted
# publishing: no token is stored here; pypi.org trusts this workflow.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the version
        run: test "v$(grep -m1 '__version__ =' reelspan_smolagents/__init__.py | cut -d'"' -f2)" = "${GITHUB_REF_NAME}"
      - run: pip install reelspan || pip install "git+https://github.com/Reelspan/reelspan-python"
      - run: pip install -e ".[test]" && pytest -q
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
