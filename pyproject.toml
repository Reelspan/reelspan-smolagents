[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelspan-smolagents"
dynamic = ["version"]
description = "Hugging Face smolagents tools for Reelspan: let an agent publish videos, photos and text to TikTok, YouTube, Instagram, X, LinkedIn and 17 more networks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anjum Labs", email = "support@reelspan.com" }]
keywords = ["reelspan", "smolagents", "huggingface", "agents", "tools", "social media", "publishing", "tiktok", "youtube", "instagram", "upload-post"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["smolagents>=1.20", "reelspan>=1.0.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
mcp = ["smolagents[mcp]>=1.20"]

[project.urls]
Homepage = "https://reelspan.com/docs/smolagents"
Source = "https://github.com/Reelspan/reelspan-smolagents"
Issues = "https://github.com/Reelspan/reelspan-smolagents/issues"

[tool.setuptools]
packages = ["reelspan_smolagents"]

[tool.setuptools.dynamic]
version = { attr = "reelspan_smolagents.__version__" }

[tool.setuptools.package-data]
reelspan_smolagents = ["py.typed"]

[tool.pytest.ini_options]

testpaths = ["tests"]
